services:
  tesla-locator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesla-locator
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Persists temporary share links across restarts
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
