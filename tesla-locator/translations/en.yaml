configuration:
  mqtt_broker_url:
    name: MQTT broker URL
    description: "Broker TeslaMate publishes to (e.g. mqtt://core-mosquitto:1883 for the Mosquitto add-on, mqtt://192.168.1.10:1883, mqtts://… for TLS)."
  mqtt_username:
    name: MQTT username
    description: Leave empty if the broker does not require authentication.
  mqtt_password:
    name: MQTT password
  mqtt_topic:
    name: Location topic
    description: TeslaMate topic for the vehicle location (other telemetry topics use the same prefix).
  admin_access_token:
    name: Admin token
    description: Full access (MQTT console, simulator) for direct access through the network port. Not used from the Home Assistant sidebar.
  user_access_token:
    name: User token
    description: Read-only access (location, speed, battery, state, route) for direct access through the network port.
  public_url:
    name: Public URL
    description: "Direct-access address reachable by share link recipients (e.g. https://tesla.example.com). Without it, only the link token is returned."
  telegram_bot_token:
    name: Telegram bot token
    description: Token provided by @BotFather. Leave empty to disable notifications.
  telegram_chat_id:
    name: Telegram chat ID
    description: "Conversation that receives the notifications (several separated by commas). Message the bot first so it is allowed to reply."
  notify_charge_started:
    name: Notify charge start
    description: Message one minute after charging starts, with the power and the expected end time.
  notify_charge_complete:
    name: Notify charge end
    description: Message when charging stops (limit reached or interrupted), with the energy added.
  notify_charge_ending_soon:
    name: Notify charge ending soon
    description: Message when the remaining charging time drops below the delay below.
  charge_ending_soon_minutes:
    name: Charge ending soon delay (min)
    description: Remaining charging time that triggers the notification (15 by default).
  notify_tpms:
    name: Notify low tyre pressure
    description: Message when a tyre drops below the threshold or the car raises a TPMS warning.
  tpms_alert_threshold:
    name: Tyre alert threshold (bar)
    description: Pressure below which a tyre triggers a notification (2.3 by default).
  notify_battery_low:
    name: Notify low battery
    description: Message when the battery drops below the threshold while not charging.
  battery_low_threshold:
    name: Low battery threshold (%)
    description: Level below which a notification is sent (20 by default).
  notify_left_open:
    name: Notify car left open
    description: Message when the car, parked with nobody inside, stays unlocked or with a door, trunk or window open.
  left_open_delay_minutes:
    name: Left open alert delay (min)
    description: How long the car must stay open before the notification (10 by default).
  telegram_commands:
    name: Telegram bot commands
    description: "Answers /position, /etat, /charge and /partage, only in the configured chats."
  charge_switch_entity:
    name: Charging entity
    description: "Home Assistant switch that starts / stops charging (e.g. switch.my_tesla_charge, provided by Tesla Fleet, Teslemetry or Tessie). Enables the charging buttons and scheduled charging. Leave empty to disable."
  charge_current_entity:
    name: Charging current entity
    description: "Home Assistant number entity for the charging current in amps (e.g. number.my_tesla_charge_current). Lets you choose the current when starting or scheduling a charge. Optional."
  charge_limit_entity:
    name: Charge limit entity
    description: "Home Assistant number entity for the charge limit in % (e.g. number.my_tesla_charge_limit). Lets you choose the limit when starting or scheduling a charge. Optional."
  charge_wake_entity:
    name: Wake entity
    description: "Home Assistant button that wakes the car up (e.g. button.my_tesla_wake, provided by Tesla Fleet). Pressed before setting the current or the limit, which Tesla Fleet cannot send to a sleeping car. Optional."
network:
  3000/tcp: Web UI port for token-based direct access (leave empty to only use the Home Assistant sidebar)
