configuration:
  mqtt_broker_url:
    name: URL du broker MQTT
    description: "Broker sur lequel TeslaMate publie (ex : mqtt://core-mosquitto:1883 pour l'add-on Mosquitto, mqtt://192.168.1.10:1883, mqtts://… pour TLS)."
  mqtt_username:
    name: Utilisateur MQTT
    description: Laisser vide si le broker n'exige pas d'authentification.
  mqtt_password:
    name: Mot de passe MQTT
  mqtt_topic:
    name: Topic de position
    description: Topic TeslaMate de la position du véhicule (les autres topics de télémétrie sont déduits du même préfixe).
  admin_access_token:
    name: Jeton administrateur
    description: Accès complet (console MQTT, simulateur) pour l'accès direct par le port réseau. Non utilisé via la barre latérale Home Assistant.
  user_access_token:
    name: Jeton utilisateur
    description: Accès en lecture seule (position, vitesse, batterie, état, itinéraire) pour l'accès direct par le port réseau.
  public_url:
    name: URL publique
    description: "Adresse d'accès direct joignable par les destinataires des liens de partage (ex : https://tesla.mondomaine.fr). Sans elle, seul le jeton du lien est fourni."
  telegram_bot_token:
    name: Jeton du bot Telegram
    description: Jeton fourni par @BotFather. Laisser vide pour désactiver les notifications.
  telegram_chat_id:
    name: Chat ID Telegram
    description: "Identifiant de la conversation qui reçoit les notifications (plusieurs séparés par des virgules). Écrire d'abord au bot pour l'autoriser à vous répondre."
  notify_charge_started:
    name: Notifier le début de charge
    description: Message une minute après le début de la recharge, avec la puissance et l'heure de fin prévue.
  notify_charge_complete:
    name: Notifier la fin de charge
    description: Message quand la recharge s'arrête (limite atteinte ou interrompue), avec l'énergie ajoutée.
  notify_charge_ending_soon:
    name: Notifier la fin de charge imminente
    description: Message quand le temps de charge restant passe sous le délai ci-dessous.
  charge_ending_soon_minutes:
    name: Délai avant fin de charge (min)
    description: Temps de charge restant qui déclenche la notification (15 par défaut).
  notify_tpms:
    name: Notifier une pression de pneu basse
    description: Message quand un pneu passe sous le seuil ou que la voiture signale une alerte TPMS.
  tpms_alert_threshold:
    name: Seuil d'alerte pneus (bar)
    description: Pression en dessous de laquelle un pneu déclenche une notification (2.3 par défaut).
  notify_battery_low:
    name: Notifier une batterie basse
    description: Message quand la batterie passe sous le seuil hors recharge.
  battery_low_threshold:
    name: Seuil de batterie basse (%)
    description: Niveau en dessous duquel une notification est envoyée (20 par défaut).
  notify_left_open:
    name: Notifier une voiture laissée ouverte
    description: Message quand la voiture, garée sans personne à bord, reste déverrouillée ou avec une porte, un coffre ou une fenêtre ouverts.
  left_open_delay_minutes:
    name: Délai avant alerte d'ouverture (min)
    description: Durée pendant laquelle la voiture doit rester ouverte avant la notification (10 par défaut).
  telegram_commands:
    name: Commandes du bot Telegram
    description: "Répond aux commandes /position, /etat, /charge et /partage, uniquement dans les chats configurés."
  charge_switch_entity:
    name: Entité de recharge
    description: "Interrupteur Home Assistant qui démarre / arrête la recharge (ex : switch.ma_tesla_charge, fourni par Tesla Fleet, Teslemetry ou Tessie). Active les boutons de recharge et la recharge programmée. Laisser vide pour désactiver."
network:
  3000/tcp: Port de l'interface web pour un accès direct par jeton (laisser vide pour n'utiliser que la barre latérale Home Assistant)
