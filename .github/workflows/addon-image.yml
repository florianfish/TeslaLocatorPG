name: "Image de l'add-on Home Assistant"

on:
  push:
    branches: [main]
    paths:
      - 'tesla-locator/config.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v6

      - name: Lire la version de l'add-on
        id: version
        run: echo "version=$(yq -r '.version' tesla-locator/config.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            APP_VERSION=v${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/teslalocatorpg-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/teslalocatorpg-${{ matrix.arch }}:latest
          labels: |
            io.hass.name=Tesla Tracker
            io.hass.type=addon
            io.hass.version=${{ steps.version.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
